name: Python Unit Testing CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip list # Display installed packages for debugging
        
    - name: Run unit tests with pytest
      run: |
        python -m pytest test_square_area.py -v
        
    - name: Generate test report
      if: always()
      run: |
        pytest test_square_area.py --junitxml=test-results.xml
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: test-results.xml
